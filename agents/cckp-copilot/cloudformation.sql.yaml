# ---------------------------------------------------------------------------
# Usage
# ---------------------------------------------------------------------------
# This template deploys a Bedrock Agent backed by a Lambda function that
# queries the CCKP's curated Synapse View tables directly via SQL (the
# Synapse table-query REST API) — no knowledge graph or SPARQL endpoint
# required. This is the CCKP Copilot's recommended backend today: it needs
# no new infrastructure beyond what's already in this repo (see
# cloudformation.sparql.yaml for the graph-RAG alternative, which requires
# a hosted SPARQL endpoint that does not exist yet).
#
# The pattern (Bedrock Agent + Lambda action group + optional docs KB) is
# adapted from nf-osi/portal-chatbot's NF Portal Copilot template, which
# uses the SPARQL variant against a live NF-OSI knowledge graph.
#
# What you will need to change:
#
#   Instruction      – The agent system prompt is embedded inline in the
#                       BedrockAgent resource below.  Replace the entire
#                       block with your own instructions.
#   KnowledgeBases   – The KB ID in the BedrockAgent resource and the
#                       matching RetrieveFromKB policy in BedrockAgentRole
#                       are placeholders until a real CCKP docs KB is
#                       provisioned.  Replace with your own KB ID, or
#                       remove both blocks entirely if you have no KB.
#
# Parameters to supply:
#
#   AgentName          – Pick a unique name for your agent.
#   FoundationModelId  – The model the agent will use.  Default is Claude
#                        Haiku 4.5 via a cross-region inference profile.
#                        Change this to any model your account has access to.
#   SynapseAuthToken   – Synapse Personal Access Token the Lambda uses to
#                        query the View tables (even public CCKP data
#                        requires an authenticated table-query request).
#                        Passed to the Lambda as an env var.
#   LambdaS3Bucket /
#   LambdaS3Key        – S3 location of your Lambda .zip package.
#
# Deploy:
#   aws cloudformation deploy \
#     --template-file cloudformation.sql.yaml \
#     --stack-name my-agent-stack \
#     --parameter-overrides \
#         AgentName=my-agent \
#         SynapseAuthToken=my-token \
#         LambdaS3Bucket=my-bucket \
#         LambdaS3Key=lambda/my-agent.zip \
#     --capabilities CAPABILITY_NAMED_IAM
#
# After the stack is created the Outputs section provides AgentId and
# AgentAliasId, which are needed to register the agent with Synapse.
#
# ---------------------------------------------------------------------------
# Updating an existing agent
# ---------------------------------------------------------------------------
# Run the same `aws cloudformation deploy` command with the same
# --stack-name to apply changes.  What to do depends on what changed:
#
#   Instructions – Edit the Instruction block in this file and redeploy.
#       For rapid iteration you can also edit directly in the Bedrock
#       console or via `aws bedrock-agent update-agent`, then copy the
#       final version back into this template so it stays in sync.
#
#   Lambda code  – Upload a new .zip to S3 (use a new S3 key or enable
#       bucket versioning) and redeploy with the updated LambdaS3Key.
#       CloudFormation only detects a Lambda code change when the S3
#       key or object version changes.
#
#   Model        – Change the FoundationModelId parameter and redeploy.
#
#   OpenAPI schema – Edit the ApiSchema Payload in this file and redeploy.
#
#   Knowledge bases – The template ships with a placeholder CCKP KB ID.
#       Do NOT keep it unless you have provisioned a real CCKP docs KB.
#       Remove the KnowledgeBases block and the RetrieveFromKB policy
#       if you have no KB, or replace the KB ID in both places with
#       your own.  KBs are created outside this template (via console,
#       CLI, or a separate stack) because they involve their own vector
#       store, embedding model, data sources, and sync schedule.
#
# The template sets AutoPrepare: true, so the agent is re-prepared
# automatically after each update.  The alias will point to the new
# version once the stack update completes.
# ---------------------------------------------------------------------------

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CCKP Copilot Bedrock Agent with a Lambda-backed SQL action group over
  Synapse View tables. See comments at the top for usage instructions.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  AgentName:
    Type: String
    Default: cckp-copilot-sql
    AllowedPattern: "^[0-9a-zA-Z][0-9a-zA-Z_-]{0,99}$"
    Description: Name for the Bedrock agent.

  AgentDescription:
    Type: String
    Default: "CCKP Copilot with SQL RAG over Synapse View tables."

  FoundationModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    AllowedPattern: "^(?!us\\.).*"
    ConstraintDescription: >
      Do not include the "us." cross-region prefix — the template prepends it automatically.
    Description: >
      Bare foundation model ID (e.g. anthropic.claude-haiku-4-5-20251001-v1:0).
      The template prepends "us." to construct the inference-profile ARN.

  IdleSessionTTL:
    Type: Number
    Default: 600
    MinValue: 60
    MaxValue: 3600
    Description: Seconds before an idle agent session expires.

  SynapseAuthToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Synapse Personal Access Token used by the Lambda to query the CCKP's
      View tables via the Synapse table-query REST API. Passed to the
      Lambda as the SYNAPSE_AUTH_TOKEN env var. Create one at
      https://www.synapse.org/PersonalAccessTokens.

  KnowledgeBaseId:
    Type: String
    Default: REPLACE_ME_CCKP_KB_ID
    Description: >
      ID of a Bedrock Knowledge Base to attach (created separately), built
      from a crawl of help.cancercomplexity.synapse.org. Set to empty
      string to skip. No CCKP KB has been provisioned yet.

  LambdaS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package (.zip).

  LambdaS3Key:
    Type: String
    Description: S3 key for the Lambda deployment package.

  AliasName:
    Type: String
    Default: live
    AllowedPattern: "^[0-9a-zA-Z][0-9a-zA-Z_-]{0,99}$"
    Description: Name for the agent alias that points to the latest version.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ---- IAM: Lambda execution role -------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AgentName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ---- Lambda function ------------------------------------------------------
  SqlRagFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AgentName}-sqlrag"
      Description: SQL helper functions over the CCKP's Synapse View tables.
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Architectures:
        - x86_64
      Environment:
        Variables:
          SYNAPSE_AUTH_TOKEN: !Ref SynapseAuthToken
          LAMBDA_TIMEOUT: "30"

  # ---- Lambda resource policy: allow Bedrock to invoke ----------------------
  LambdaBedrockPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SqlRagFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceArn: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*"

  # ---- IAM: Bedrock agent execution role ------------------------------------
  BedrockAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AgentName}-bedrock-agent-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*"
      Policies:
        - PolicyName: InvokeModel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:GetInferenceProfile
                  - bedrock:GetFoundationModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.${FoundationModelId}"
                  - !Sub "arn:aws:bedrock:*::foundation-model/${FoundationModelId}"
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SqlRagFunction.Arn
        # Remove this policy if you have no knowledge bases attached:
        - PolicyName: RetrieveFromKB
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:Retrieve
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"

  # ---- Bedrock Agent --------------------------------------------------------
  BedrockAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref AgentName
      AgentResourceRoleArn: !GetAtt BedrockAgentRole.Arn
      AutoPrepare: true
      Description: !Ref AgentDescription
      FoundationModel: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.${FoundationModelId}"
      IdleSessionTTLInSeconds: !Ref IdleSessionTTL
      Instruction: |
        ## Role

        You are the **CCKP Copilot**, a search and navigation expert for the [Cancer Complexity Knowledge Portal](https://cancercomplexity.synapse.org) (CCKP). You help researchers find cancer datasets, publications, funded grants, experimental tools, and educational resources by querying the CCKP's curated Synapse tables, and answer process, policy, and how-to questions using portal documentation. Scenarios include:

        - Retrieving resource names, ids, or counts from the tables
        - Confirming a table's exact column names before writing SQL
        - Filtering resources by tumor type, assay, tissue, species, theme, or consortium
        - Answering questions about data contribution, access requests, licensing, metadata requirements, embargo policies, and other procedures documented at help.cancercomplexity.synapse.org

        Aside from providing answers, you can also take users to the appropriate entity page.

        IMPORTANT rules of engagement:
        - Perform a max of 12 intermediate queries before updating user, who wants constant contact. If results are poor, confirm with user about alternative/deeper searches and their suggestions for refinement before proceeding.
        - Think of yourself as a guide in helping users explore a new place, not only pointing out the final destination but also interesting features along the way.
        - Curate the results; don't overwhelm users by presenting too many and explain their significance.
        - **Page navigation should be user-controlled.** Do NOT auto-redirect users to pages. Instead, present your findings first and offer navigation as a choice via `<guideprompt>`. Only include `<actions>` with a redirect when the user explicitly requests to be taken to a page (e.g. "take me to…", "show me…", "go to…") or confirms a navigation suggestion.
        - **Writing code is out of scope.** Do not write scripts, notebooks, or code snippets for users. If asked, decline and instead point them to the Synapse programmatic clients documented at https://docs.synapse.org/.
        - **Cast a wide net, then narrow.** A term like "breast cancer" may be stored as "Breast" or "breast carcinoma"; if a strict filter returns little, loosen it (broaden the term, drop a filter, try a synonym) before reporting "no results."

        ## Response Format

        Every response must contain a `<chat>` block and optionally an `<actions>` block, with nothing outside them.
        Use `<actions>` to send users to the right page.
        Only include `<actions>` when the user has explicitly requested navigation or confirmed a navigation suggestion. Omit `<actions>` otherwise.

        ```xml
        <chat>
        [Answers or intermediate updates for the user]
        </chat>
        <actions>
          <redirect>
            <target>/Explore/{ResourceType}</target>
            <query><![CDATA[
        {
          "sql": "SELECT * FROM {tableId} WHERE {conditions}",
          "additionalFilters": [],
          "selectedFacets": [],
          "includeEntityEtag": false,
          "isConsistent": true
        }
            ]]></query>
          </redirect>
        </actions>
        ```

        ### Adding Suggestions in Response

        For a new interaction, ALWAYS conclude your message with helpful suggestions using `<guideprompt>` within the `<chat>` block.
        Throughout the conversation, selectively use `<guideprompt>` to offer helpful next steps or choices to users. Examples:

        ```xml
        <chat>
          ...
          <guideprompt>Find single-cell RNA-seq datasets in breast cancer</guideprompt>
        </chat>
        ```

        ```xml
        <chat>
          Which option would you like to continue with?
          <guideprompt>Compare Grant A and Grant B</guideprompt>
          <guideprompt>Find publications funded by Grant A</guideprompt>
        </chat>
        ```

        ### Valid Tables & Targets for Redirect

        | Resource               | Synapse ID   | Target Path                   |
        |------------------------|--------------|--------------------------------|
        | Datasets               | syn21897968  | /Explore/Datasets             |
        | Publications           | syn21868591  | /Explore/Publications         |
        | Tools                  | syn26127427  | /Explore/Tools                |
        | Grants                 | syn21918972  | /Explore/Grants               |
        | Educational Resources  | syn51497305  | /Explore/EducationalResources |

        People and Other resource types exist on the portal but their backing
        table ID and/or Explore route are unconfirmed — do not redirect to
        them until those are verified.

        Example redirect to entity Collection page: `<target>/Explore/Datasets</target>`.

        Entity Details page redirects (single-resource deep links) are not yet
        confirmed for CCKP — only offer Collection-page redirects for now.

        ## Source Selection

        You have two knowledge sources. Choose the right one based on the question:

        - **Docs KB** (knowledge base): Use for process, policy, and how-to questions — data contribution steps, access request procedures, licensing, metadata requirements, embargo policies, citation guidance, and anything answered by help.cancercomplexity.synapse.org.
        - **Table KB** (SQL action group): Use for counts, listings, filtering, and retrieval of specific resources from the datasets, publications, tools, grants, and educational-resources tables.
        - **Both**: Use for compound questions that need live data and procedural context (e.g. "what breast cancer datasets are available and how do I download them?").
        - For ambiguous questions, default to the docs KB first since lookups are cheaper.

        When citing docs KB results, include the source page URL so users can visit the documentation directly.

        ## Core Toolset

        Use the CCKP SQL action group to query the curated View tables directly. First choose the query type matching the user question:

        - Use `getColumns` to confirm a table's exact deployed column names before writing SQL against an unfamiliar table — deployed names can differ slightly from documentation labels, and a wrong column name fails the query.
        - Use `sqlQuery` for filtered listing, retrieval, or joins across tables.
        - Use `countByType` for a quick portal inventory (row counts across all 5 tables).

        Tools:
        - `sqlQuery` to run SQL against one named table (`datasets`, `publications`, `tools`, `grants`, `education`, or a raw synId)
        - `getColumns` to list a table's exact column names
        - `countByType` for a quick per-table row-count inventory

        ## Base SQL query

        For retrieval of resource names, counts, or filtered listings over one table.

        Guidelines:

        - Reference tables by alias (`datasets`, `publications`, `tools`, `grants`, `education`) rather than raw synIds when calling `sqlQuery`; the Lambda resolves the alias for you.
        - Join across tables (e.g. Dataset → Grant via `grantNumber`, Dataset → Publication via `pubMedId`, Tool → Dataset via `datasets`) requires two separate `sqlQuery` calls — each call is scoped to one table/view and cannot span tables in a single SQL statement.
        - Best filter columns per table: `tumorType`, `assay`, `tissue`, `species` on datasets/publications; `topic`, `operation`, `language` on tools; `theme`, `consortium` on grants.

        ### Example for base SQL query

        Question: "What breast cancer datasets use single-cell assays?"

        Call:

        ```json
        {
          "table": "datasets",
          "sql": "SELECT * FROM {table} WHERE \"tumorType\" LIKE '%reast%' AND \"assay\" LIKE '%single%cell%'",
          "limit": 25
        }
        ```

        Answer format:

        Format most relevant hits as markdown links.
        Present your findings in the `<chat>` block and offer navigation as a `<guideprompt>` suggestion — do NOT auto-redirect.
        When the user accepts or explicitly asks to navigate, then include `<actions>` with the redirect.

        First response (no redirect yet — offer navigation):

        ```xml
        <chat>
        Here are breast cancer datasets using single-cell assays:
        - [Dataset Name 1](url) — single-cell RNA-seq
        - [Dataset Name 2](url) — single-cell ATAC-seq

        If you want, I can help answer more questions about these datasets!
        <guideprompt>Take me to the datasets collection</guideprompt>
        <guideprompt>Tell me more about Dataset Name 1</guideprompt>
        </chat>
        ```

        After the user confirms navigation (e.g. "Take me to the datasets collection"):

        ```xml
        <chat>
        Here is the datasets collection filtered for you.
        </chat>
        <actions>
          <redirect>
            <target>/Explore/Datasets</target>
            <query><![CDATA[
        {
          "sql": "SELECT * FROM syn21897968 WHERE \"tumorType\" LIKE '%reast%' AND \"assay\" LIKE '%single%cell%'",
          "additionalFilters": [],
          "selectedFacets": [],
          "includeEntityEtag": false,
          "isConsistent": true
        }
            ]]></query>
          </redirect>
        </actions>
        ```
      ActionGroups:
        - ActionGroupName: cckp-sql-actions
          ActionGroupExecutor:
            Lambda: !GetAtt SqlRagFunction.Arn
          ApiSchema:
            Payload: |
              openapi: 3.0.0
              info:
                title: CCKP SQL Function API
                version: 1.0.0
                description: >
                  This schema describes the three agent-facing functions for querying the
                  CCKP's curated Synapse View tables directly via SQL (no knowledge graph /
                  SPARQL endpoint required). A Lambda adapter maps these operations to
                  Bedrock action-group style function calls via apiPath or function name.
              tags:
                - name: sql
                  description: SQL query and introspection operations over the CCKP View tables
              paths:
                /sql-query:
                  post:
                    tags:
                      - sql
                    operationId: sqlQuery
                    summary: Execute a SQL query against one CCKP table
                    description: >
                      Runs a SQL query against one of the CCKP's Synapse View tables
                      (datasets, publications, tools, grants, education, or a raw synId)
                      and returns matching rows plus the total match count. The literal
                      `{table}` in the sql string is replaced with the resolved synId.
                    requestBody:
                      required: true
                      content:
                        application/json:
                          schema:
                            $ref: "#/components/schemas/SqlQueryRequest"
                          examples:
                            breastCancerDatasets:
                              value:
                                table: datasets
                                sql: SELECT * FROM {table} WHERE "tumorType" LIKE '%reast%'
                                limit: 25
                    responses:
                      "200":
                        description: Query result rows or application-level error payload
                        content:
                          application/json:
                            schema:
                              $ref: "#/components/schemas/QueryResultResponse"
                /columns:
                  post:
                    tags:
                      - sql
                    operationId: getColumns
                    summary: List the exact column names of one CCKP table
                    description: >
                      Returns the deployed column names for one table. Call this before
                      writing a SQL query against an unfamiliar table.
                    requestBody:
                      required: true
                      content:
                        application/json:
                          schema:
                            $ref: "#/components/schemas/GetColumnsRequest"
                          examples:
                            datasets:
                              value:
                                table: datasets
                    responses:
                      "200":
                        description: Requested column list or application-level error payload
                        content:
                          application/json:
                            schema:
                              $ref: "#/components/schemas/GetColumnsResponse"
                /count-by-type:
                  post:
                    tags:
                      - sql
                    operationId: countByType
                    summary: Count rows in each of the 5 CCKP tables
                    description: >
                      Returns a quick portal inventory: the row count of each of the
                      datasets, publications, tools, grants, and education tables.
                    responses:
                      "200":
                        description: Per-table row counts
                        content:
                          application/json:
                            schema:
                              $ref: "#/components/schemas/CountByTypeResponse"
              components:
                schemas:
                  SqlQueryRequest:
                    type: object
                    required:
                      - table
                      - sql
                    properties:
                      table:
                        type: string
                        description: >
                          Table alias (datasets, publications, tools, grants, education)
                          or a raw Synapse synId.
                      sql:
                        type: string
                        description: >
                          SQL query text. The literal `{table}` is replaced with the
                          resolved synId before execution.
                      limit:
                        type: integer
                        description: Maximum rows to return (default 25, max 200).
                    additionalProperties: false
                  GetColumnsRequest:
                    type: object
                    required:
                      - table
                    properties:
                      table:
                        type: string
                        description: >
                          Table alias (datasets, publications, tools, grants, education)
                          or a raw Synapse synId.
                    additionalProperties: false
                  QueryResultResponse:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Total matching row count (independent of limit).
                      headers:
                        type: array
                        items:
                          type: string
                      rows:
                        type: array
                        items:
                          type: object
                      error:
                        type: string
                        description: Application-level error text returned by the function.
                    additionalProperties: false
                  GetColumnsResponse:
                    type: object
                    properties:
                      table:
                        type: string
                      columns:
                        type: array
                        items:
                          type: string
                      error:
                        type: string
                    additionalProperties: false
                  CountByTypeResponse:
                    type: object
                    properties:
                      counts:
                        type: object
                        description: Map of table alias to row count.
                      errors:
                        type: object
                        description: Map of table alias to error text, present only on partial failure.
                    additionalProperties: false
      # Remove this block if you have no knowledge bases to attach:
      KnowledgeBases:
        - KnowledgeBaseId: !Ref KnowledgeBaseId
          Description: "CCKP documentation (help.cancercomplexity.synapse.org)."
          KnowledgeBaseState: ENABLED
      SkipResourceInUseCheckOnDelete: true

  # ---- Agent Alias ----------------------------------------------------------
  AgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Properties:
      AgentId: !GetAtt BedrockAgent.AgentId
      AgentAliasName: !Ref AliasName

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  AgentId:
    Description: Bedrock Agent ID
    Value: !GetAtt BedrockAgent.AgentId

  AgentAliasId:
    Description: Agent Alias ID (use with Synapse registration)
    Value: !GetAtt AgentAlias.AgentAliasId

  AgentArn:
    Description: Full ARN of the Bedrock Agent
    Value: !GetAtt BedrockAgent.AgentArn

  LambdaFunctionArn:
    Description: ARN of the SQL RAG Lambda function
    Value: !GetAtt SqlRagFunction.Arn

  BedrockAgentRoleArn:
    Description: ARN of the Bedrock Agent execution role
    Value: !GetAtt BedrockAgentRole.Arn
