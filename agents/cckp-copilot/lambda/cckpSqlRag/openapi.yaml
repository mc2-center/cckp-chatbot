openapi: 3.0.0
info:
  title: CCKP SQL Function API
  version: 1.0.0
  description: >
    This schema describes the agent-facing functions for querying the Cancer
    Complexity Knowledge Portal (CCKP)'s curated Synapse View tables directly
    via SQL (no knowledge graph / SPARQL endpoint required), plus dataset and
    file discovery helpers that resolve a dataset's underlying Synapse entity
    to its actual file contents and accessibility. A Lambda adapter maps
    these operations to Bedrock action-group style function calls via apiPath
    or function name.
tags:
  - name: sql
    description: SQL query and introspection operations over the CCKP View tables
  - name: discovery
    description: Dataset and file discovery operations against the Synapse REST API
paths:
  /sql-query:
    post:
      tags:
        - sql
      operationId: sqlQuery
      summary: Execute a SQL query against one CCKP table
      description: >
        Runs a SQL query against one of the CCKP's Synapse View tables
        (datasets, publications, tools, grants, education, or a raw synId)
        and returns matching rows plus the total match count. The literal
        `{table}` in the sql string is replaced with the resolved synId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlQueryRequest"
            examples:
              breastCancerDatasets:
                value:
                  table: datasets
                  sql: SELECT * FROM {table} WHERE "tumorType" LIKE '%reast%'
                  limit: 25
      responses:
        "200":
          description: Query result rows or application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResultResponse"
  /explore-url:
    post:
      tags:
        - sql
      operationId: buildExploreUrl
      summary: Build a working CCKP portal Explore URL, optionally pre-filtered
      description: >
        Returns a ready-to-use portal Explore URL for a table, optionally
        filtered by free-text search and/or exact-value column facets. The
        portal reads filter state from a compressed `qw0` query param
        (gzip+base64+urlencoded JSON) that can't be hand-constructed as LLM
        output, so this function builds it. Use this instead of hand-writing
        a `<query>` redirect block — a custom SQL WHERE clause embedded in a
        redirect is silently ignored by the portal (confirmed live); only
        `searchExpression` and `facets` actually filter results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildExploreUrlRequest"
            examples:
              freeTextSearch:
                value:
                  table: datasets
                  searchExpression: glioma
              facetFilter:
                value:
                  table: datasets
                  facets:
                    - columnName: species
                      values: ["Zebrafish"]
      responses:
        "200":
          description: The ready-to-use Explore URL, or an application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildExploreUrlResponse"
  /columns:
    post:
      tags:
        - sql
      operationId: getColumns
      summary: List the exact column names of one CCKP table
      description: >
        Returns the deployed column names for one table. Deployed names can
        differ slightly from the data-model labels, so call this before
        writing a SQL query against an unfamiliar table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetColumnsRequest"
            examples:
              datasets:
                value:
                  table: datasets
      responses:
        "200":
          description: Requested column list or application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetColumnsResponse"
  /count-by-type:
    post:
      tags:
        - sql
      operationId: countByType
      summary: Count rows in each of the 5 CCKP tables
      description: >
        Returns a quick portal inventory: the row count of each of the
        datasets, publications, tools, grants, and education tables.
      responses:
        "200":
          description: Per-table row counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountByTypeResponse"
  /dataset-files:
    post:
      tags:
        - discovery
      operationId: getDatasetFiles
      summary: List the file contents of a dataset's underlying Synapse entity
      description: >
        Resolves a Synapse entity id (e.g. a datasets row's downloadSynId) to
        its file contents. If the entity is a first-class Synapse Dataset,
        returns its curated item list directly (truncated to `limit`, since a
        Dataset can hold up to 30,000 items). If it's a Folder/Project
        container, lists its file/folder children instead (one page per
        call; pass the previous response's nextPageToken to fetch more).
        Call getColumns or a sqlQuery first to find a row's downloadSynId
        before calling this. The response always includes a `restriction`
        field so a separate checkRestriction call isn't required for this id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetDatasetFilesRequest"
            examples:
              example:
                value:
                  id: syn12345678
      responses:
        "200":
          description: Dataset item list, container children, or an application-level error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDatasetFilesResponse"
  /file-details:
    post:
      tags:
        - discovery
      operationId: getFileDetails
      summary: Get real file metadata (name/size/type/checksum) for a file entity
      description: >
        Returns the actual FileHandle metadata for a file entity id, typically
        one surfaced by getDatasetFiles. A bare entity fetch only exposes a
        file handle reference, not the file's real name/size/type. The
        response always includes a `restriction` field so a separate
        checkRestriction call isn't required for this id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetFileDetailsRequest"
            examples:
              example:
                value:
                  id: syn87654321
      responses:
        "200":
          description: File metadata or an application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFileDetailsResponse"
  /check-restriction:
    post:
      tags:
        - discovery
      operationId: checkRestriction
      summary: Check whether datasets/files are actually publicly accessible
      description: >
        Must be called before telling a user a dataset or file is
        downloadable — CCKP is a public-data-only, read-only portal, and not
        every entity has restrictionLevel OPEN. Accepts up to 50 ids per call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRestrictionRequest"
            examples:
              example:
                value:
                  ids: ["syn12345678", "syn87654321"]
      responses:
        "200":
          description: Per-id restriction level, or an application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckRestrictionResponse"
components:
  schemas:
    SqlQueryRequest:
      type: object
      required:
        - table
        - sql
      properties:
        table:
          type: string
          description: >
            Table alias (datasets, publications, tools, grants, education)
            or a raw Synapse synId.
        sql:
          type: string
          description: >
            SQL query text. The literal `{table}` is replaced with the
            resolved synId before execution.
        limit:
          type: integer
          description: Maximum rows to return (default 25, max 200).
      additionalProperties: false
    BuildExploreUrlRequest:
      type: object
      required:
        - table
      properties:
        table:
          type: string
          description: >
            Table alias (datasets, publications, tools, grants, education).
            Must be an alias, not a raw synId — the Explore URL path segment
            is derived from it.
        searchExpression:
          type: string
          description: >
            Optional free-text search term, applied as a natural-language
            TextMatchesQueryFilter (this is how the portal's own search box
            filters results).
        facets:
          type: array
          items:
            type: object
            required:
              - columnName
              - values
            properties:
              columnName:
                type: string
              values:
                type: array
                items:
                  type: string
          description: >
            Optional exact-value column filters, applied as
            FacetColumnValuesRequest entries (e.g. columnName "species",
            values ["Zebrafish"]).
      additionalProperties: false
    BuildExploreUrlResponse:
      type: object
      properties:
        url:
          type: string
          description: >
            Ready-to-use relative Explore path (e.g. "/Explore/Datasets/?qw0=...")
            with the qw0 filter param already encoded. Relative, not absolute —
            use verbatim as a redirect target, same as any other Collection/Detail
            Page path.
        error:
          type: string
          description: Application-level error text returned by the function.
      additionalProperties: false
    GetColumnsRequest:
      type: object
      required:
        - table
      properties:
        table:
          type: string
          description: >
            Table alias (datasets, publications, tools, grants, education)
            or a raw Synapse synId.
      additionalProperties: false
    QueryResultResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total matching row count (independent of limit).
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
        error:
          type: string
          description: Application-level error text returned by the function.
      additionalProperties: false
    GetColumnsResponse:
      type: object
      properties:
        table:
          type: string
        columns:
          type: array
          items:
            type: string
        error:
          type: string
      additionalProperties: false
    CountByTypeResponse:
      type: object
      properties:
        counts:
          type: object
          description: Map of table alias to row count.
        errors:
          type: object
          description: Map of table alias to error text, present only on partial failure.
      additionalProperties: false
    GetDatasetFilesRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: >
            Raw Synapse entity id backing a dataset row (e.g. its
            downloadSynId), not one of the 5 View table ids.
        limit:
          type: integer
          description: >
            Only used when the entity is a first-class Dataset. Maximum items
            to return out of its (possibly up to 30,000-entry) item list
            (default 25, max 200).
        nextPageToken:
          type: string
          description: >
            Only used when the entity is a Folder/Project container. Pass
            the nextPageToken from a previous response to fetch the next
            page of children.
      additionalProperties: false
    GetDatasetFilesResponse:
      type: object
      properties:
        type:
          type: string
          description: Either "dataset" (a first-class Synapse Dataset) or "container" (a Folder/Project).
        items:
          type: array
          items:
            type: object
          description: Present when type=dataset. Flat list of {entityId, versionNumber} file references, truncated to `limit`.
        returnedCount:
          type: integer
          description: Present when type=dataset. Number of items actually returned (i.e. after truncation to `limit`).
        count:
          type: integer
          description: Present when type=dataset. True total number of items in the dataset, independent of truncation.
        size:
          type: integer
          description: Present when type=dataset. Cumulative bytes of all items.
        checksum:
          type: string
          description: Present when type=dataset. Server-computed checksum.
        children:
          type: array
          items:
            type: object
          description: Present when type=container. List of {id, name, type, versionNumber}.
        totalChildCount:
          type: integer
          description: Present when type=container.
        sumFileSizesBytes:
          type: integer
          description: Present when type=container.
        nextPageToken:
          type: string
          description: Present when type=container and more children exist beyond this page.
        restriction:
          type: object
          description: >
            Present for both type=dataset and type=container. Either
            {restrictionLevel: OPEN|RESTRICTED_BY_TERMS_OF_USE|CONTROLLED_BY_ACT,
            hasUnmetAccessRequirement} for this id, or {error} if the check
            itself failed.
        error:
          type: string
          description: Application-level error text returned by the function.
      additionalProperties: false
    GetFileDetailsRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Synapse file entity id, typically one surfaced by getDatasetFiles.
        versionNumber:
          type: integer
          description: Optional specific version to fetch file handles for.
      additionalProperties: false
    GetFileDetailsResponse:
      type: object
      properties:
        id:
          type: string
        files:
          type: array
          items:
            type: object
          description: List of {fileHandleId, fileName, contentSize, contentType, contentMd5}.
        restriction:
          type: object
          description: >
            Either {restrictionLevel: OPEN|RESTRICTED_BY_TERMS_OF_USE|CONTROLLED_BY_ACT,
            hasUnmetAccessRequirement} for this file id, or {error} if the
            check itself failed.
        error:
          type: string
          description: Application-level error text returned by the function.
      additionalProperties: false
    CheckRestrictionRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          description: Up to 50 raw Synapse entity ids (datasets and/or files) to check.
      additionalProperties: false
    CheckRestrictionResponse:
      type: object
      properties:
        restrictions:
          type: object
          description: >
            Map of entity id (in the same "synXXXXXXX" form passed in `ids`)
            to {restrictionLevel: OPEN|RESTRICTED_BY_TERMS_OF_USE|CONTROLLED_BY_ACT,
            hasUnmetAccessRequirement}.
        error:
          type: string
          description: Application-level error text returned by the function.
      additionalProperties: false
